# Render free-tier blueprint. Secrets are set in the dashboard, never here.
services:
  - type: web
    name: gym-tracker
    runtime: python
    plan: free
    # Deploy a commit only once its GitHub checks (the CI workflow) have
    # passed, instead of on every push. Render counts success, neutral and
    # skipped as passing, and skips a commit with a failed check or no checks
    # at all. Applies when this service is managed by this Blueprint; a
    # service created by hand has the same switch under Settings, Auto-Deploy.
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Only read by migrate_multi_user.py and the CLI scripts. Logins go
      # through the `users` table; nobody authenticates against these.
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: LOCAL_TIMEZONE
        value: UTC
      - key: PAIN_SAFEGUARD_ENABLED
        value: "true"
      - key: PBKDF2_ITERATIONS
        value: "600000"
      - key: SESSION_TTL_DAYS
        value: "30"
